syntax = "proto3";

package memos.store;

option go_package = "gen/store";

message MemoPayload {
  Property property = 1;

  Location location = 2;

  repeated string tags = 3;

  // Campus lost-and-found: the lifecycle status of the item.
  // One of "LOST" (item reported lost), "FOUND" (item reported found),
  // "RESOLVED" (owner and finder matched).
  string item_status = 4;

  // Campus lost-and-found: whether the post hides the creator's identity
  // from other regular users (admins and the creator still see it).
  bool is_anonymous = 5;

  // The calculated properties from the memo content.
  message Property {
    bool has_link = 1;
    bool has_task_list = 2;
    bool has_code = 3;
    bool has_incomplete_tasks = 4;
    // The title extracted from the first H1 heading, if present.
    string title = 5;
  }

  message Location {
    string placeholder = 1;
    double latitude = 2;
    double longitude = 3;
  }
}
